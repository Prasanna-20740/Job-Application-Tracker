
services:
  db:
    image: postgres:16
    container_name: job_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: job_tracker
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: job_tracker_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
